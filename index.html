<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block Breaker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <form id="level-code-form" class="level-code">
      <output id="credit-balance" class="credit-balance">Credits: 0</output>
      <label for="level-code">Code</label>
      <input id="level-code" name="code" type="text" inputmode="numeric" maxlength="4" autocomplete="off">
    </form>
    <section class="game-stage" aria-label="Block Breaker">
      <div class="game-board">
        <canvas id="game" width="600" height="450" tabindex="-1" aria-label="Block Breaker game"></canvas>
        <div id="start-menu" class="start-menu">
          <canvas id="menu-canvas" width="600" height="450" aria-hidden="true"></canvas>
          <button id="start-game" type="button">Start Game</button>
          <button id="open-shop" type="button">Shop</button>
          <button id="open-settings" type="button">Settings</button>
        </div>
        <section id="shop-menu" class="shop-menu" aria-labelledby="shop-title" hidden>
          <div class="shop-header">
            <h2 id="shop-title">Loot Chest</h2>
            <button id="open-chest" class="chest-button" type="button">Open chest · 250</button>
          </div>
          <div class="contains-row">Contains:</div>
          <div id="shop-list" class="shop-list" aria-live="polite"></div>
          <div id="chest-reveal" class="chest-reveal" hidden>
            <canvas id="chest-reveal-canvas" width="420" height="220" aria-label="Chest reveal canvas"></canvas>
          </div>
          <button id="close-shop" class="menu-back-button" type="button">Back</button>
        </section>
        <section id="settings-menu" class="shop-menu" aria-labelledby="settings-title" hidden>
          <h2 id="settings-title">Settings</h2>
          <div class="shop-item settings-item">
            <h3>Reset Credits</h3>
            <button id="reset-credits" type="button">Reset</button>
          </div>
          <button id="close-settings" class="menu-back-button" type="button">Back</button>
        </section>
      </div>
      <h1 id="game-title" class="game-title">Block Breaker</h1>
    </section>
    <p>Move with the arrow keys or A and D. Press Shift for a brief paddle speed boost (7-second cooldown). Press Space to launch the ball, then press Space again to fire collected Snipe ammo.</p>
  </main>

  <!-- The order matters: game.js goes first because the other files use its settings. -->
  <script src="game.js"></script>
  <script src="components.js"></script>
  <script src="bricks.js"></script>
  <script src="collisions.js"></script>
</body>
</html>
